<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestätigung</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA4FF}a:hover{color:#B7C5FF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3A3F46; font-family: 'Instrument Sans', system-ui, sans-serif; color: #EDEBE6">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 64px 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0.35">
    <div style="height: 28px; width: 50%; border-radius: 8px; background: #6B7178"></div>
    <div style="height: 200px; border-radius: 16px; background: #6B7178"></div>
    <div style="height: 64px; border-radius: 16px; background: #6B7178"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 520px; box-sizing: border-box; background: #101214; border-radius: 28px 28px 0 0; padding: 14px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #2E333A; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#EDEBE6" stroke-width="10" stroke-linecap="round"></path><circle cx="58" cy="44" r="7.5" fill="#5B7BFF"></circle></svg>
        <span style="font-size: 16px; font-weight: 600">Wendelin</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1.5px dashed #6B7178; color: #C9CCD0">○ Claude Haiku</span>
    </div>

    <div style="font-size: 16px; color: #A3A8AE">„Lösch den Zahnarzttermin am Donnerstag.“</div>

    <div style="border: 1.5px solid #E8B341; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E8B341; letter-spacing: 0.04em; text-transform: uppercase">
        <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 L18.5 17.5 L1.5 17.5 Z" fill="#E8B341"></path><path d="M10 7.5 L10 11.5 M10 14.2 L10 14.4" stroke="#101214" stroke-width="2" stroke-linecap="round"></path></svg>
        Braucht deine Bestätigung
      </div>
      <div style="font-size: 24px; font-weight: 600; line-height: 1.25">Termin löschen?</div>
      <div style="background: #1A1D21; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 17px; font-weight: 600">Zahnarzt Dr. Weber</div>
        <div style="font-size: 14px; color: #A3A8AE">Do 15.10. · 08:30–09:15 · Kalender Familie</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3A8AE">calendar__delete_event · Stufe external</div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="height: 56px; border-radius: 14px; border: 1.5px solid #2E333A; background: transparent; color: #EDEBE6; font-family: inherit; font-size: 17px; font-weight: 600">Nein, behalten</button>
      <button style="height: 56px; border-radius: 14px; border: none; background: #F4F2ED; color: #101214; font-family: inherit; font-size: 17px; font-weight: 600">Ja, löschen</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #A3A8AE">
      <div aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #5B7BFF"></div>
      Sag einfach „ja“ oder „nein“
    </div>
  </div>
</div>
</body>
</html>
