<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wendelin – Logo und Schriftzug</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3355E8}a:hover{color:#1F3BB8}
</style>
</head>
<body>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; padding: 56px; background: #F4F2ED; color: #15171A; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5F66">Wendelin · Kombination W3 + W8</div>
      <h1 style="margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.02em">Ohrmuschel als Zeichen und als i-Punkt</h1>
    </div>
  </div>

  <!-- Hauptlockup -->
  <div style="height: 300px; border-radius: 24px; background: #FFFFFF; border: 1px solid #DEDAD2; display: flex; align-items: center; justify-content: center; gap: 40px">
    <svg width="132" height="132" viewBox="0 0 100 100" role="img" aria-label="Wendelin Bildmarke">
      <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#15171A" stroke-width="8" stroke-linecap="round"></path>
      <circle cx="58" cy="44" r="6" fill="#3355E8"></circle>
    </svg>
    <div role="img" aria-label="wendelin" style="display: flex; align-items: flex-end; font-size: 88px; font-weight: 600; letter-spacing: -0.03em; line-height: 1">
      <span aria-hidden="true">wendel</span>
      <svg aria-hidden="true" width="30.25" height="90.75" viewBox="0 0 22 66" style="margin: 0 -3px 0 0">
        <svg x="3" y="1" width="18" height="18" viewBox="0 0 100 100">
          <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#3355E8" stroke-width="13" stroke-linecap="round"></path>
          <circle cx="58" cy="44" r="10" fill="#15171A"></circle>
        </svg>
        <rect x="6" y="26" width="10" height="38" rx="1" fill="#15171A"></rect>
      </svg>
      <span aria-hidden="true">n</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <!-- Dunkel -->
    <div style="height: 200px; border-radius: 20px; background: #101214; display: flex; align-items: center; justify-content: center; gap: 20px">
      <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Wendelin Bildmarke hell">
        <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#EDEBE6" stroke-width="9" stroke-linecap="round"></path>
        <circle cx="58" cy="44" r="7" fill="#5B7BFF"></circle>
      </svg>
      <div role="img" aria-label="wendelin" style="display: flex; align-items: flex-end; font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #EDEBE6">
        <span aria-hidden="true">wendel</span>
        <svg aria-hidden="true" width="19.25" height="57.75" viewBox="0 0 22 66" style="margin: 0 -1.9px 0 0">
          <svg x="3" y="1" width="18" height="18" viewBox="0 0 100 100">
            <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#5B7BFF" stroke-width="14" stroke-linecap="round"></path>
            <circle cx="58" cy="44" r="11" fill="#EDEBE6"></circle>
          </svg>
          <rect x="6" y="26" width="10" height="38" rx="1" fill="#EDEBE6"></rect>
        </svg>
        <span aria-hidden="true">n</span>
      </div>
    </div>
    <!-- Nur Schriftzug -->
    <div style="height: 200px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DEDAD2; display: flex; align-items: center; justify-content: center">
      <div role="img" aria-label="wendelin" style="display: flex; align-items: flex-end; font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1">
        <span aria-hidden="true">wendel</span>
        <svg aria-hidden="true" width="19.25" height="57.75" viewBox="0 0 22 66" style="margin: 0 -1.9px 0 0">
          <svg x="3" y="1" width="18" height="18" viewBox="0 0 100 100">
            <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#3355E8" stroke-width="14" stroke-linecap="round"></path>
            <circle cx="58" cy="44" r="11" fill="#15171A"></circle>
          </svg>
          <rect x="6" y="26" width="10" height="38" rx="1" fill="#15171A"></rect>
        </svg>
        <span aria-hidden="true">n</span>
      </div>
    </div>
    <!-- Gestapelt auf Blau -->
    <div style="height: 200px; border-radius: 20px; background: #3355E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Wendelin Bildmarke weiß">
        <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></path>
        <circle cx="58" cy="44" r="7" fill="#FFFFFF"></circle>
      </svg>
      <div role="img" aria-label="wendelin" style="display: flex; align-items: flex-end; font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #FFFFFF">
        <span aria-hidden="true">wendel</span>
        <svg aria-hidden="true" width="13.75" height="41.25" viewBox="0 0 22 66" style="margin: 0 -1.4px 0 0">
          <svg x="3" y="1" width="18" height="18" viewBox="0 0 100 100">
            <path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></path>
            <circle cx="58" cy="44" r="12" fill="#FFFFFF"></circle>
          </svg>
          <rect x="6" y="26" width="10" height="38" rx="1" fill="#FFFFFF"></rect>
        </svg>
        <span aria-hidden="true">n</span>
      </div>
    </div>
  </div>

  <!-- App-Icons und kleine Größen -->
  <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #DEDAD2; border-radius: 20px; padding: 28px 40px">
    <div style="display: flex; align-items: flex-end; gap: 28px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 26px; background: #101214; display: flex; align-items: center; justify-content: center">
          <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#EDEBE6" stroke-width="10" stroke-linecap="round"></path><circle cx="58" cy="44" r="7.5" fill="#5B7BFF"></circle></svg>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">Icon dunkel</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 26px; background: #3355E8; display: flex; align-items: center; justify-content: center">
          <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path><circle cx="58" cy="44" r="7.5" fill="#FFFFFF"></circle></svg>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">Icon Kobalt</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 26px; background: #F4F2ED; border: 1px solid #DEDAD2; display: flex; align-items: center; justify-content: center">
          <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#15171A" stroke-width="10" stroke-linecap="round"></path><circle cx="58" cy="44" r="7.5" fill="#3355E8"></circle></svg>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">Icon hell</span>
      </div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 28px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#15171A" stroke-width="11" stroke-linecap="round"></path><circle cx="58" cy="44" r="9" fill="#15171A"></circle></svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">48 px</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><path d="M 60 88 C 38 92, 20 72, 22 48 C 24 22, 52 8, 72 20 C 88 30, 86 56, 66 61 C 54 64, 45 55, 51 47" fill="none" stroke="#15171A" stroke-width="13" stroke-linecap="round"></path><circle cx="58" cy="44" r="10" fill="#15171A"></circle></svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">32 px</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><path d="M 62 88 C 36 90, 20 70, 22 48 C 24 22, 52 10, 72 22 C 88 32, 84 56, 64 58" fill="none" stroke="#15171A" stroke-width="15" stroke-linecap="round"></path><circle cx="52" cy="46" r="11" fill="#15171A"></circle></svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">24 px</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: #101214; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><path d="M 62 88 C 36 90, 20 70, 22 48 C 24 22, 52 10, 72 22 C 88 32, 84 56, 64 58" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></path><circle cx="52" cy="46" r="11" fill="#FFFFFF"></circle></svg>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A5F66">Benachr.</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
