[package]
name = "wendelin_attest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Offline-Prüfung von TEE-Attestierungen (TDX-Quotes, ACI-Berichte, Quittungen) für Wendelin"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dcap-qvl = { version = "0.7", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pem = { version = "4", default-features = false, features = ["std"] }
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
zeroize = "1"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
flutter_rust_bridge = "=2.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
