[package]
name = "wendelin_attest"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["probe"]

[features]
probe = ["dcap-qvl/report", "tokio"]

[dependencies]
dcap-qvl = { version = "0.7", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
