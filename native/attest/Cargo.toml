[package]
name = "wendelin_attest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Offline-Prüfung von TEE-Attestierungen (TDX-Quotes, ACI-Berichte, Quittungen) für Wendelin"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dcap-qvl = { version = "0.7", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pem = { version = "4", default-features = false, features = ["std"] }
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
zeroize = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
flutter_rust_bridge = "=2.12.0"
# EHBP/HPKE (WP76c): RFC 9180 Sender; hpke 0.13 braucht rand_core 0.9 (neben dem 0.6 der übrigen Module)
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core09 = { package = "rand_core", version = "0.9", default-features = false, features = ["os_rng"] }
# SEV-SNP (WP76a): RSA-PSS der AMD-Kette, ECDSA P-384 des Reports
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding", "sha2"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# Sigstore (WP76b): ECDSA P-256 für DSSE/Rekor, Base64 für Bundles
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
