# cargo deny check (Gate-Schritt "rust deny", WP47): nur permissive Lizenzen, keine Warnungen ignorieren.
[graph]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Marvin-Angriff trifft nur private RSA-Schlüsseloperationen (Entschlüsseln/Signieren). `rsa` dient hier
# ausschließlich der Prüfung öffentlicher AMD-Zertifikatssignaturen (WP76a, `src/snp.rs`); es gibt
# keinen privaten RSA-Schlüssel und keine Operation, die von Angreifern beobachtbar ist. Wegfall, sobald
# ein gepatchtes `rsa` erscheint.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa nur zum Verifizieren öffentlicher Signaturen (AMD-Kette), nie mit privatem Schlüssel" },
]
