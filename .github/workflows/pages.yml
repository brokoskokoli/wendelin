# SPDX-License-Identifier: GPL-3.0-or-later
# Project homepage: mirrors website/ to the root of the gh-pages branch, which GitHub Pages serves
# at https://brokoskokoli.github.io/wendelin/. Files that other workflows put on gh-pages (update feeds
# appcast*.xml, release notes notes/) are never touched here - add any further ones to EXCLUDES.
# Pages setting: Settings -> Pages -> "Deploy from a branch", gh-pages, / (root).
# This is the canonical pages.yml: if other skills (release pipelines) ship one too, use only this.
# CNAME (custom domain) lives on gh-pages and is kept as well.
# Actions are pinned by commit SHA (comment = tag); Dependabot keeps them current.
name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; the release workflow pushes feeds in its own concurrency group, and
# both sides rebase on a concurrent push.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website to gh-pages
    # Forks don't publish the upstream site.
    if: github.repository == 'brokoskokoli/wendelin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # push to gh-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Copy website/ to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://github.com/$GITHUB_REPOSITORY.git"
          work=$(mktemp -d "$RUNNER_TEMP/pages.XXXXXX")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          if git ls-remote --exit-code --heads "$repo_url" gh-pages >/dev/null; then
            git clone --quiet --branch gh-pages --single-branch "$repo_url" "$work/pages"
          else
            git init --quiet --initial-branch gh-pages "$work/pages"
            git -C "$work/pages" remote add origin "$repo_url"
          fi

          # Files owned by other workflows: never deleted or overwritten by the website deploy.
          # Patterns starting with / are anchored at the branch root.
          EXCLUDES=(--exclude /.git --exclude '/appcast*.xml' --exclude /notes/ --exclude /CNAME)
          rsync -a --delete "${EXCLUDES[@]}" website/ "$work/pages/"
          touch "$work/pages/.nojekyll"
          git -C "$work/pages" add -A
          if git -C "$work/pages" diff --cached --quiet; then
            echo "Website unchanged - nothing to publish"; exit 0
          fi
          git -C "$work/pages" commit --quiet -m "Website: ${GITHUB_SHA::7}"

          # A concurrent feed push only touches excluded files: rebase onto it and retry.
          for attempt in 1 2 3 4 5; do
            if git -C "$work/pages" push --quiet origin HEAD:gh-pages; then exit 0; fi
            echo "::warning::Push to gh-pages failed (attempt $attempt) - fetching and rebasing"
            sleep $((attempt * 5))
            git -C "$work/pages" fetch --quiet origin gh-pages
            git -C "$work/pages" rebase --quiet FETCH_HEAD
          done
          echo "::error::Could not push the website to gh-pages"; exit 1
