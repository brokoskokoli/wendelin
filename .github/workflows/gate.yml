name: gate
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      # Rust-Prüfmodul native/attest (WP47): fmt, clippy, test, deny und "frb-Code aktuell"
      # laufen im Gate; mit CI=true ist ein fehlendes Werkzeug ein Fehler.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/attest
      - name: Rust-Werkzeuge (cargo-deny, flutter_rust_bridge_codegen)
        uses: actions/cache@v4
        id: rust-tools
        with:
          path: ~/.cargo/bin
          key: rust-tools-${{ runner.os }}-deny-0.19-frb-2.12.0
      - if: steps.rust-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --locked
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: dart run tool/gate.dart --no-app
      - name: Zeitzonen-Lauf (Ortszeit-Logik)
        run: dart test
        working-directory: packages/wendelin_storage
        env:
          TZ: Europe/Berlin
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      # Gerätetests (integration_test) brauchen einen Emulator und laufen
      # lokal mit tool/e2e_android.sh; hier werden sie nur analysiert.
      - run: flutter analyze --fatal-infos lib $( [ -d test ] && echo test ) $( [ -d integration_test ] && echo integration_test )
        working-directory: app
      - run: if [ -d test ]; then flutter test; fi
        working-directory: app
      # Bei roten Goldens die Vergleichsbilder sichern (nur Test-Widgets, keine Daten).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7
  # K7 am fertigen APK: keine GMS-/Firebase-Klassen, Manifest (exportierte
  # Komponenten, Berechtigungen, Backup) und Gradle-Baum ohne GMS und ohne
  # nicht aufgelöste Abhängigkeiten. arm64 reicht für die Prüfung.
  apk:
    # Release-APK only for main and PRs, not on every branch push (costly).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Rust-Prüfmodul (WP47): cargo-ndk baut die .so für arm64-v8a, Gradle packt sie ins APK.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/attest
      - name: cargo-ndk und NDK
        uses: actions/cache@v4
        id: ndk-tools
        with:
          path: ~/.cargo/bin
          key: rust-tools-${{ runner.os }}-ndk-4.1
      - if: steps.ndk-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked
      - run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: app
      # JVM-Unit-Tests der Kotlin-Logik (der Gradle-Wrapper entsteht beim Build).
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: app/android
      - run: tool/check_apk.sh app/build/app/outputs/flutter-apk/app-release.apk
