name: gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart run tool/gate.dart --no-app
      - name: Zeitzonen-Lauf (Ortszeit-Logik)
        run: dart test
        working-directory: packages/wendelin_storage
        env:
          TZ: Europe/Berlin
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter analyze --fatal-infos lib $( [ -d test ] && echo test )
        working-directory: app
      - run: if [ -d test ]; then flutter test; fi
        working-directory: app
