name: gate
# Volles Gate in CI (WP95): Ubuntu-Matrix je Paket, App-Tests in Shards ohne
# Goldens, Goldens nur auf dem gepinnten macOS-Runner, Rust, kotlin-unit, APK.
# Lokal laufen Agenten nur `--changed`; dieses Gate ist die Freigabe vor dem Merge.
on:
  push:
    branches: [main, 'wp/**']
  pull_request:
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  FLUTTER_VERSION: 3.47.7
  CI: 'true'
jobs:
  packages:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - wendelin_agent
          - wendelin_core
          - wendelin_integrations
          - wendelin_mcp
          - wendelin_providers
          - wendelin_storage
          - wendelin_tools
          - wendelin_voice
          - evals
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      # Format, Analyse, Tests und Abdeckung des Pakets (ohne Werkzeug-Prüfungen).
      - run: dart run tool/gate.dart ${{ matrix.pkg }}
      - name: Zeitzonen-Lauf (Ortszeit-Logik)
        if: matrix.pkg == 'wendelin_storage'
        run: dart test
        working-directory: packages/wendelin_storage
        env:
          TZ: Europe/Berlin

  # Rust-Prüfmodul native/attest (WP47) und die Prüfungen über das ganze Repo
  # (check_*, Selbsttests). Mit CI=true ist ein fehlendes Werkzeug ein Fehler.
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Version = native/attest/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      # rust-cache sichert auch ~/.cargo/bin; installiert wird nur, was fehlt.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/attest
      - name: Rust-Werkzeuge (cargo-deny, flutter_rust_bridge_codegen)
        run: |
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version '~0.19' --locked
          command -v flutter_rust_bridge_codegen >/dev/null || cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: dart run tool/gate.dart native/attest

  app-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed app/lib app/test app/integration_test
      # Gerätetests (integration_test) brauchen einen Emulator (tool/e2e_android.sh); hier nur Analyse.
      - run: flutter analyze --fatal-infos lib test integration_test
        working-directory: app

  # App-Tests ohne Goldens und ohne plattformabhängige Tests, in Shards.
  app-test:
    name: app-test ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >
          flutter test --coverage --exclude-tags golden,platform-sensitive
          --total-shards 3 --shard-index $(( ${{ matrix.shard }} - 1 ))
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: app-lcov-${{ matrix.shard }}
          path: app/coverage/lcov.info
          retention-days: 1

  # Abdeckung von app/lib/di über alle Shards (Schwelle wie im lokalen Gate).
  app-coverage:
    needs: app-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          pattern: app-lcov-*
          path: lcov
      - run: dart run tool/check_app_coverage.dart lcov/*/lcov.info

  # Goldens und plattformabhängige Tests (FFI) nur auf dem gepinnten macOS-Runner.
  goldens:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test --tags "golden || platform-sensitive"
        working-directory: app
      # Bei roten Goldens die Vergleichsbilder sichern (nur Test-Widgets, keine Daten).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  kotlin-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Erzeugt Gradle-Wrapper und local.properties ohne vollen Build.
      - run: flutter build apk --config-only
        working-directory: app
      - run: ./gradlew :app:testDebugUnitTest -q
        working-directory: app/android

  # K7 am fertigen APK: keine GMS-/Firebase-Klassen, Manifest (exportierte
  # Komponenten, Berechtigungen, Backup) und Gradle-Baum ohne GMS und ohne
  # nicht aufgelöste Abhängigkeiten. arm64 reicht für die Prüfung.
  apk:
    # Release-APK nur für main und PRs, nicht bei jedem Branch-Push (teuer).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Rust-Prüfmodul (WP47): cargo-ndk baut die .so für arm64-v8a, Gradle packt sie ins APK.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/attest
      - name: cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --version 4.1.2 --locked
      - run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: app
      - run: tool/check_apk.sh app/build/app/outputs/flutter-apk/app-release.apk
