name: gate
# Volles Gate in CI (WP95): Ubuntu-Matrix je Paket (gate.dart --only, wendelin_integrations
# in 2 Shards), globale Prüfungen und Werkzeug-Selbsttests einmal im Job global-checks,
# App-Tests in Shards ohne Goldens, Goldens nur auf dem gepinnten macOS-Runner, Rust,
# kotlin-unit, APK. Nur Doku geändert (tool/ci_scope.sh): allein der Job docs-only (check_docs);
# Branches mit Code bekommen immer den vollen Lauf, tool/merge_wp.sh prüft das (WP110).
# Lokal laufen Agenten nur `--changed`; dieses Gate ist die Freigabe vor dem Merge.
on:
  push:
    branches: [main, 'wp/**']
  pull_request:
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.47.7
  NDK_VERSION: 28.2.13676358
  CI: 'true'
jobs:
  # Autor, Committer und Trailer aller Commits des Branches (WP109):
  # nur die noreply-Identität, genau ein Co-Authored-By, keine Claude-Session.
  commit-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Commit-Identität und Trailer
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: tool/check_commit_identity.sh --ci

  # Umfang des Laufs (tool/ci_scope.sh): docs_only (nur Markdown geändert, Bezug: Merge-Basis mit
  # main bzw. voriger Push auf main), android (APK-Job) und die Paketliste aus dem Repo (wie
  # tool/gate.dart: packages/* plus evals; wendelin_integrations in 2 Shards), damit kein Paket
  # an der Matrix vorbei neu hinzukommt.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.f.outputs.docs_only }}
      android: ${{ steps.f.outputs.android }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: f
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: tool/ci_scope.sh --ci
      - id: m
        run: |
          matrix=$( { ls packages; [ -f evals/pubspec.yaml ] && [ -d evals/lib ] && echo evals; } | sort | jq -R . | jq -sc '[ .[] as $p | if $p == "wendelin_integrations" then (1, 2) as $i | {pkg: $p, shard: $i, shards: 2} else {pkg: $p, shard: 1, shards: 1} end ]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  # Nur Doku geändert: allein check_docs (die Pfade in der Agenten-Doku) und check_concept (Konzept gegen STATUS und ADRs).
  docs-only:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: dart run tool/check_docs.dart
      - run: dart run tool/check_concept.dart

  packages:
    name: ${{ matrix.pkg }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      # Format, Analyse, Tests und Abdeckung des Pakets; ohne globale Prüfungen und Werkzeug-
      # Selbsttests (die laufen einmal im Job global-checks). Geteilte Pakete prüfen die
      # Abdeckung über alle Shards im Job pkg-coverage.
      - run: dart run tool/gate.dart --only ${{ matrix.pkg }}${{ matrix.shards > 1 && format(' --shard={0}/{1}', matrix.shard, matrix.shards) || '' }}
      - if: matrix.shards > 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-lcov-${{ matrix.pkg }}-${{ matrix.shard }}
          path: packages/${{ matrix.pkg }}/coverage/lcov.info
          retention-days: 1
      - name: Zeitzonen-Lauf (Ortszeit-Logik)
        if: matrix.pkg == 'wendelin_storage'
        run: dart test
        working-directory: packages/wendelin_storage
        env:
          TZ: Europe/Berlin

  # Abdeckung von wendelin_integrations über beide Shards (Schwelle wie im lokalen Gate).
  pkg-coverage:
    needs: [scope, packages]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pkg-lcov-wendelin_integrations-*
          path: lcov
      - run: dart run tool/check_pkg_coverage.dart wendelin_integrations lcov/*/lcov.info

  # Prüfungen über das ganze Repo (check_*, Selbsttests der Werkzeuge) einmal, nicht je Paket.
  global-checks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # check_texts vergleicht die Allowlist mit origin/main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/gate.dart --globals

  # Rust-Prüfmodul native/attest (WP47). Mit CI=true ist ein fehlendes Werkzeug ein Fehler.
  rust-checks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Version = native/attest/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
      # rust-cache sichert auch ~/.cargo/bin; installiert wird nur, was fehlt.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/attest
      - name: Rust-Werkzeuge (cargo-deny, flutter_rust_bridge_codegen)
        run: |
          cargo deny --version 2>/dev/null | grep -q ' 0\.19\.' || cargo install cargo-deny --version '~0.19' --locked --force
          flutter_rust_bridge_codegen --version 2>/dev/null | grep -q '2\.12\.0' || cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked --force
      - run: dart run tool/gate.dart --only native/attest

  app-analyze:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed app/lib app/test app/integration_test
      # Gerätetests (integration_test) brauchen einen Emulator (tool/e2e_android.sh); hier nur Analyse.
      - run: flutter analyze --fatal-infos lib test integration_test
        working-directory: app

  # App-Tests ohne Goldens und ohne plattformabhängige Tests, in Shards.
  app-test:
    name: app-test ${{ matrix.shard }}/3
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >
          flutter test --coverage --exclude-tags golden,platform-sensitive
          --total-shards 3 --shard-index $(( ${{ matrix.shard }} - 1 ))
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-lcov-${{ matrix.shard }}
          path: app/coverage/lcov.info
          retention-days: 1

  # Abdeckung von app/lib/di über alle Shards (Schwelle wie im lokalen Gate).
  app-coverage:
    needs: [scope, app-test]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-lcov-*
          path: lcov
      - run: dart run tool/check_app_coverage.dart lcov/*/lcov.info

  # Goldens und plattformabhängige Tests (FFI) nur auf dem gepinnten macOS-Runner.
  goldens:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test --tags "golden || platform-sensitive"
        working-directory: app
      # Bei roten Goldens die Vergleichsbilder sichern (nur Test-Widgets, keine Daten).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  kotlin-unit:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # NDK aus dem Cache bzw. mit Wiederholung installieren (tool/ci_install_ndk.sh).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - run: tool/ci_install_ndk.sh "$NDK_VERSION"
      - run: flutter pub get
      # Erzeugt Gradle-Wrapper und local.properties ohne vollen Build.
      - run: flutter build apk --config-only
        working-directory: app
      - run: ./gradlew :app:testDebugUnitTest -q
        working-directory: app/android

  # K7 am fertigen APK: keine GMS-/Firebase-Klassen, Manifest (exportierte
  # Komponenten, Berechtigungen, Backup) und Gradle-Baum ohne GMS und ohne
  # nicht aufgelöste Abhängigkeiten. arm64 reicht für die Prüfung.
  apk:
    # Release-APK nur für main und PRs; auf wp/** nur, wenn Android oder
    # pubspec* betroffen sind (K7, GMS-Prüfung), sonst zu teuer.
    needs: scope
    if: >
      needs.scope.outputs.docs_only != 'true' && (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      needs.scope.outputs.android == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Rust-Prüfmodul (WP47): cargo-ndk baut die .so für arm64-v8a, Gradle packt sie ins APK.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/attest
      - name: cargo-ndk
        run: cargo ndk --version 2>/dev/null | grep -q '4\.1\.2' || cargo install cargo-ndk --version 4.1.2 --locked --force
      # NDK aus dem Cache bzw. mit Wiederholung installieren (tool/ci_install_ndk.sh).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - run: tool/ci_install_ndk.sh "$NDK_VERSION"
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: app
      - run: tool/check_apk.sh app/build/app/outputs/flutter-apk/app-release.apk
