name: release
# Signierte Release-APK (WP131, K102/K103): Tag v* (z. B. v0.6.0; mit „-“ = Vorabversion) legt ein
# GitHub-Release mit APK und SHA256SUMS an. Manuell (workflow_dispatch) baut und prüft derselbe
# Ablauf, legt aber KEIN Release an (nur ein kurzlebiges Workflow-Artefakt zum Ansehen).
# Die Secrets liegen nur im Job build (nur lesende Rechte); der Job release (contents: write)
# bekommt nur die fertigen Dateien. Anleitung: docs/RELEASE.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      probe_missing_secrets:
        description: 'Probe: Secrets leer lassen, der Lauf muss am Schritt „Secrets prüfen“ rot werden'
        type: boolean
        default: false
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.47.7
  NDK_VERSION: 28.2.13676358
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # Gate-Ergebnis des Commits lesen
    outputs:
      apk: ${{ steps.meta.outputs.apk }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      fingerprint: ${{ steps.sign.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 1. Günstige Prüfungen zuerst: fehlen Secrets, ist der Lauf sofort rot (Namen, nie Werte).
      #    Probe: Die Eingabe leert die Secret-Umgebung.
      - name: Secrets prüfen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: tool/release_check.sh secrets
      - name: Version und Name
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tool/release_check.sh version "$REF_NAME"
            ver="${REF_NAME#v}"
            pre="$(tool/release_check.sh prerelease "$REF_NAME")"
          else
            ver="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' app/pubspec.yaml | head -1)-dispatch"
            pre=true
          fi
          echo "apk=wendelin-$ver.apk" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"
      # Nur für Tags: Das Gate muss auf genau diesem Commit grün gelaufen sein (main-Push oder
      # wp/*-Push). Ein manueller Probelauf veröffentlicht nichts und braucht es nicht.
      - name: Gate des Commits grün
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ok="$(gh api "repos/$REPO/actions/workflows/gate.yml/runs?head_sha=$SHA&per_page=50" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::Kein grüner Gate-Lauf für Commit $SHA. Erst Gate abwarten (bzw. laufen lassen), dann taggen."
            exit 1
          fi
          echo "ok: grüner Gate-Lauf für $SHA"
      # 2. Build wie im Gate-Job apk (arm64).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/attest
      - name: cargo-ndk
        run: cargo ndk --version 2>/dev/null | grep -q '4\.1\.2' || cargo install cargo-ndk --version 4.1.2 --locked --force
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - run: tool/ci_install_ndk.sh "$NDK_VERSION"
      # 3. Keystore nur nach RUNNER_TEMP (nie ins Repo), Pfad ist kein Geheimnis.
      - name: Keystore bereitstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Keystore-Secret ergibt keine Datei (kein gültiges Base64?)"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"
      - name: Release-APK bauen
        working-directory: app
        env:
          WENDELIN_REQUIRE_RELEASE_SIGNING: '1'
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: flutter build apk --release --target-platform android-arm64
      - name: APK prüfen (K7, Manifest)
        # Ohne Keystore-Pfad: Gradle liest die Signatur-Umgebung beim Konfigurieren, und ein
        # Pfad ohne Passwörter (hier nicht gesetzt) gälte als unvollständig.
        run: env -u ANDROID_KEYSTORE_PATH tool/check_apk.sh app/build/app/outputs/flutter-apk/app-release.apk
      # 4. Signatur: das APK-Zertifikat muss das des Keystores sein (nicht der Debug-Schlüssel).
      - name: Signatur prüfen
        id: sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.probe_missing_secrets != true && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          tool/release_check.sh cert-match app/build/app/outputs/flutter-apk/app-release.apk "$ANDROID_KEYSTORE_PATH" >"$RUNNER_TEMP/cert.txt" || { cat "$RUNNER_TEMP/cert.txt"; exit 1; }
          cat "$RUNNER_TEMP/cert.txt"
          fp="$(sed -n 's/^SHA-256 (Zertifikat): //p' "$RUNNER_TEMP/cert.txt")"
          echo "fingerprint=$fp" >>"$GITHUB_OUTPUT"
          {
            echo "### Release-Zertifikat"
            echo "APK: \`$APK_NAME\`"
            echo "SHA-256 (öffentlich): \`$fp\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Dateien zusammenstellen
        env:
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" >SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/
          retention-days: ${{ github.ref_type == 'tag' && 7 || 3 }}
          if-no-files-found: error
      - name: Keystore löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/cert.txt"

  release:
    # Nur für Tags; ein manueller Lauf legt bewusst kein Release (auch keinen Entwurf) an.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build.outputs.apk }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          range="${prev:+$prev..}$TAG"
          # Ohne früheren v*-Tag nur die letzten 50 Merges (nicht die ganze Historie).
          git log --merges -n 50 --pretty='- %s' "$range" >notes-body.txt
          {
            if [ -s notes-body.txt ]; then
              echo "## Änderungen seit ${prev:-Beginn}"; echo; cat notes-body.txt; echo
            fi
            echo "## Prüfen"; echo
            echo "Zertifikat-Fingerabdruck (SHA-256): \`$FINGERPRINT\`"
            echo "Prüfsumme der APK: siehe \`SHA256SUMS\`."
          } >notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          [ -s notes-body.txt ] || flags+=(--generate-notes)
          gh release create "$TAG" "dist/$APK_NAME" dist/SHA256SUMS --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
