name: update-goldens
# Erzeugt die Golden-Referenzbilder auf dem gepinnten Runner und lädt sie als
# Artefakt hoch (manuell: gh workflow run update-goldens.yml --ref <branch>).
on: workflow_dispatch
jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens --tags golden
        working-directory: app
      - run: git status --porcelain | sed 's/^...//' | tar -cf goldens.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: goldens.tar
          retention-days: 3
