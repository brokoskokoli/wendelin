name: update-goldens
# Erzeugt die Golden-Referenzbilder auf dem gepinnten Runner und lädt sie als
# Artefakt hoch (manuell: gh workflow run update-goldens.yml --ref <branch>).
on: workflow_dispatch
jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens --tags golden
        working-directory: app
      - run: git status --porcelain | sed 's/^...//' | tar -cf goldens.tar -T -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goldens
          path: goldens.tar
          retention-days: 3
