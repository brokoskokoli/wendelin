version = 1
SPDX-PackageName = "Wendelin"
SPDX-PackageDownloadLocation = "https://github.com/brokoskokoli/wendelin"

# Licensing per REUSE (https://reuse.software), checked with `reuse lint`.
# Source files carry no per-file headers; this file assigns the copyright notice and the
# license to everything. License texts live in LICENSES/.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wendelin contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled fonts (SIL Open Font License 1.1). Provenance: app/assets/fonts/SOURCES.txt; the
# copyright notices of the font authors are in the OFL-*.txt files next to the fonts.
[[annotations]]
path = ["app/assets/fonts/*.ttf", "app/assets/fonts/OFL-*.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2017 IBM Corp. (IBM Plex Mono)", "2022 The Instrument Sans Project Authors (Instrument Sans)"]
SPDX-License-Identifier = "OFL-1.1"

# Speech models (wake word, speech recognition, speech output) are not part of this repository.
# They are downloaded by the app; their licenses and attributions are listed in the app under
# Settings -> Voice -> Licenses of the speech models (app/lib/ui/settings/voice_licenses_screen.dart)
# and, for the wake-word model, in docs/notes/wake-word-v8-licenses.md.

# Speech test fixtures (app/test/fixtures/stt/*.wav): generated by tool/make_stt_fixtures.sh with
# Piper voices (VITS) via sherpa-onnx TTS. The audio carries the license of the voice's dataset
# (model cards in the sherpa-onnx tts-models archives; sources and versions in the script header).
# German: Thorsten-Voice dataset (CC0-1.0), English: LJ Speech (public domain, CC0-1.0).
[[annotations]]
path = ["app/test/fixtures/stt/de-*.wav", "app/test/fixtures/stt/b6-0[1-5].wav", "app/test/fixtures/stt/lock-*.wav", "app/test/fixtures/stt/stop-*.wav"]
precedence = "override"
SPDX-FileCopyrightText = "Thorsten-Voice dataset (T. Mueller, https://github.com/thorstenMueller/Thorsten-Voice), speech synthesis with the Piper voice de_DE-thorsten-medium"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "app/test/fixtures/stt/en-*.wav"
precedence = "override"
SPDX-FileCopyrightText = "LJ Speech dataset (K. Ito, L. Johnson, https://keithito.com/LJ-Speech-Dataset/, public domain), speech synthesis with the Piper voice en_US-ljspeech-medium"
SPDX-License-Identifier = "CC0-1.0"

# French: SIWIS database, CC-BY-4.0, attribution required (also in the README acknowledgements).
[[annotations]]
path = ["app/test/fixtures/stt/fr-*.wav", "app/test/fixtures/stt/b6-06.wav"]
precedence = "override"
SPDX-FileCopyrightText = "University of Edinburgh, SIWIS French Speech Synthesis Database (https://doi.org/10.7488/ds/1705), speech synthesis with the Piper voice fr_FR-siwis-medium"
SPDX-License-Identifier = "CC-BY-4.0"
