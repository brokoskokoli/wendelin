# Golden-Tests sind plattformabhängig (Schrift-Rasterung). Sie tragen den Tag
# `golden`; auf anderen Plattformen lassen sie sich mit
# `flutter test --exclude-tags golden` auslassen. Formen und Farben sichern
# zusätzlich plattformunabhängige Tests (test/ui/shapes_test.dart).
tags:
  golden: {}
  # Plattformabhängige Tests (Gutachten N5): FFI nur auf macOS
  # (test/platform/voice/ffi_support.dart) bzw. Dateisystem-Annahmen
  # (model_files_test.dart). Sie laufen im Gate mit; bei einem Fehler nur
  # auf einer Plattform zuerst hier nachsehen. Auslassen mit
  # `flutter test --exclude-tags platform-sensitive`.
  platform-sensitive: {}
  # Renders README/website screenshots (WP169, tool/make_screenshots.sh);
  # nothing is compared. The tests skip themselves unless SCREENSHOT_DIR is
  # set, so gate and CI do not render anything.
  screenshots: {}
