name: wendelin
description: "Wendelin - personal voice assistant."
publish_to: 'none'
version: 0.1.2+3

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  android_intent_plus: ^6.1.0
  archive: ^4.5.1
  audioplayers: ^6.8.1
  clock: ^1.1.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: any
  meta: ^1.19.0
  multicast_dns: ^0.3.3
  path_provider: ^2.1.6
  platform: ^3.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  sherpa_onnx: ^1.13.8
  wendelin_agent: any
  wendelin_core: any
  wendelin_integrations: any
  wendelin_mcp: any
  wendelin_providers: any
  wendelin_storage: any
  wendelin_tools: any
  wendelin_voice: any

dev_dependencies:
  fake_async: any
  test_api: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7
  integration_test:
    sdk: flutter
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/fonts/OFL-InstrumentSans.txt
    - assets/fonts/OFL-IBMPlexMono.txt
  fonts:
    # Instrument Sans und IBM Plex Mono (SIL OFL 1.1, Lizenztexte in
    # assets/fonts/OFL-*.txt). Gebündelt statt zur Laufzeit geladen.
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Launcher-Icons laut docs/design/DESIGN.md. Erzeugt mit
#   dart pub global activate flutter_launcher_icons 0.14.4
#   dart pub global run flutter_launcher_icons
# (bewusst keine dev_dependency: sie würde im Workspace xml/cli_util
# herabstufen). Die erzeugten Dateien sind eingecheckt; die Änderung des
# Tools an ios/Runner.xcodeproj/project.pbxproj danach verwerfen.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../docs/design/logo/app-icon-dark.png"
  adaptive_icon_background: "#101214"
  adaptive_icon_foreground: "../docs/design/logo/app-icon-foreground.png"
  # Die Vorlage enthält die Schutzzone bereits.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 26
