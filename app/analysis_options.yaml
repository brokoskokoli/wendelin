include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/gen/**"
    # erzeugt von flutter_rust_bridge (Opaque-Typen lösen strict-inference-Warnungen aus)
    - "lib/platform/attest/generated/**"
    - "build/**"
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
