include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/gen/**"
    # nur die frb-Hauptdatei: ihre Opaque-Typen (RustArcStaticData) lösen
    # inference_failure_on_instance_creation aus und sind nicht änderbar
    - "lib/platform/attest/generated/frb_generated.dart"
    - "build/**"
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
